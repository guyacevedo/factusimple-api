services:
  postgres:
    image: 'postgres:latest'
    restart: unless-stopped
    environment:
      # Docker usa estas variables internas para inicializar la DB
      - POSTGRES_DB=${DB_DATABASE_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - pgdata:/data/postgres
volumes:
  pgdata: