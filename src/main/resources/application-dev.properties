server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP configuration for development
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

factus.url=${FACTUS_ENDPOINT_SANDBOX}
factus.user=${FACTUS_USER}
factus.password=${FACTUS_PASSWORD}
factus.client-id=${FACTUS_CLIENT_ID}
factus.client-secret=${FACTUS_CLIENT_SECRET}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

logging.level.root=INFO
logging.level.com.factusimple=DEBUG

# Encryption (32-byte key in Base64, 44 chars)
app.encryption.key=${ENCRYPTION_KEY}