server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

factus.url=${FACTUS_ENDPOINT_SANDBOX}
factus.user=${FACTUS_USER}
factus.password=${FACTUS_PASSWORD}
factus.client-id=${FACTUS_CLIENT_ID}
factus.client-secret=${FACTUS_CLIENT_SECRET}
factus.expected-audience=${FACTUS_EXPECTED_AUDIENCE}

logging.level.root=INFO
logging.level.com.factusimple=DEBUG

# Encryption (32-byte key in Base64, 44 chars)
app.encryption.key=${ENCRYPTION_KEY:aGVsbG93b3JsZGhlbGxvd29ybGRoZWxsb3dvcmxkdGVzdA==}