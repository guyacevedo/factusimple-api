server.port=${PORT}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always

factus.url=${FACTUS_ENDPOINT_SANDBOX}
factus.user=${FACTUS_USER}
factus.password=${FACTUS_PASSWORD}
factus.client_id=${FACTUS_CLIENT_ID}
factus.client_secret=${FACTUS_CLIENT_SECRET}
factus.expected-audience=${FACTUS_EXPECTED_AUDIENCE}

logging.level.root=INFO
logging.level.com.factusimple=DEBUG