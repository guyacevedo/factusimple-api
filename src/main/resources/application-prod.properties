server.port=${PORT}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP tuning
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

api.url=${FACTUS_ENDPOINT_SANDBOX}
api.user=${FACTUS_USER}
api.password=${FACTUS_PASSWORD}
api.client_id=${FACTUS_CLIENT_ID}
api.client_secret=${FACTUS_CLIENT_SECRET}

# Async
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50

# Logging
logging.level.org.springframework=INFO