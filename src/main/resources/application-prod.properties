server.port=${PORT}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_DATABASE_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP tuning for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

factus.url=${FACTUS_ENDPOINT}
factus.user=${FACTUS_USER}
factus.password=${FACTUS_PASSWORD}
factus.client-id=${FACTUS_CLIENT_ID}
factus.client-secret=${FACTUS_CLIENT_SECRET}
factus.expected-audience=${FACTUS_EXPECTED_AUDIENCE}

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=24

# Encryption (32-byte key in Base64)
app.encryption.key=${ENCRYPTION_KEY}

# Async
spring.task.execution.pool.core-size=10
spring.task.execution.pool.max-size=50

# Logging
logging.level.org.springframework=INFO

# Swagger disabled in production
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false