
spring.profiles.active=dev

spring.application.name=factusimple-api

server.servlet.context-path=/api

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Configuracion de Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Pageable configuration (P-3: Limit max page size to prevent OOM)
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Resilience4j Circuit Breaker
resilience4j.circuitbreaker.instances.factus.sliding-window-size=10
resilience4j.circuitbreaker.instances.factus.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.factus.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.factus.permitted-calls-in-half-open-state=3

# Resilience4j Retry
resilience4j.retry.instances.factus.max-attempts=2
resilience4j.retry.instances.factus.wait-duration=1s
