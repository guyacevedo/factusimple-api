server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_DATABASE_NAME:factusimple_db}
spring.datasource.username=${DB_USER:factusimple}
spring.datasource.password=${DB_PASSWORD:factusimpleSecure}

# HikariCP configuration for testing
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.connection-test-query=SELECT 1

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always

factus.url=${FACTUS_ENDPOINT_SANDBOX:http://localhost:9999}
factus.user=${FACTUS_USER:test}
factus.password=${FACTUS_PASSWORD:test}
factus.client-id=${FACTUS_CLIENT_ID:test}
factus.client-secret=${FACTUS_CLIENT_SECRET:test}

app.jwt.secret=${JWT_SECRET:test-secret-key-for-testing}
app.jwt.expiration-hours=24

logging.level.root=WARN
logging.level.com.factusimple=INFO

app.encryption.key=${ENCRYPTION_KEY:aGVsbG93b3JsZGhlbGxvd29ybGRoZWxsb3dvcmxkdGVzdA==}
